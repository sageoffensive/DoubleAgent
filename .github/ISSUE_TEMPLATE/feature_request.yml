name: Feature request
description: Propose an operator workflow or product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and scope impact
      description: Note any effect on target traffic, credentials, approvals, or finding authority.
