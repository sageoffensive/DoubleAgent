name: Bug report
description: Report a reproducible DoubleAgent defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, cookies, private targets, or customer data. Report security vulnerabilities privately.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v3.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Burp extension
        - Agent B
        - macOS app
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Sanitized diagnostics
      description: Remove secrets and target-specific information before pasting logs.
