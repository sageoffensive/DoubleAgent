name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check agent_b/static/app.js
      - name: DoubleAgent tests
        run: python -m unittest discover -s tests -v
      - name: Burp source compiles
        run: python -m py_compile burp/DoubleAgent.py burp/src/*.py
      - name: Agent B tests
        working-directory: agent_b
        run: python -m unittest discover -s tests -v

  macos-bundle:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained app (ad-hoc CI signature)
        run: zsh agent_b/build-macos-app.sh
      - name: Test bundled runtime
        working-directory: agent_b
        run: |
          "dist/Agent B.app/Contents/Resources/python/bin/python3" -E -s -B -m unittest discover -s tests -q
          "dist/Agent B.app/Contents/Resources/python/bin/python3" -E -s -B tests/smoke_macos_bundle.py "dist/Agent B.app"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
